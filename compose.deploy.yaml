services:
  postgres:
    image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: ghcr.io/sjinie/coffee-price-prediction-api@sha256:f915ef214f538ee71d44b4e65f0864a6ad6bb117c289fc3561041986bf7ded77
    platform: linux/amd64
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      CORS_ORIGINS: http://127.0.0.1:${WEB_PORT:?WEB_PORT is required}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    image: ghcr.io/sjinie/coffee-price-prediction-web@sha256:db82b1088695602333e138331436eccd0f3e62f82290052ca0420cd8f4eedf72
    platform: linux/amd64
    environment:
      API_UPSTREAM: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:?WEB_PORT is required}:80"

  pipeline:
    image: ghcr.io/sjinie/coffee-price-prediction-pipeline@sha256:031348602cf120e12a1ada64b7111bbf3968fcb4fc51426f63332410c588da1e
    platform: linux/amd64
    profiles: ["jobs"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      FRED_API_KEY: ${FRED_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - pipeline-data:/data
      - type: bind
        source: ${SOURCE_DIR:?SOURCE_DIR is required}
        target: /seed
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MODELS_DIR:?MODELS_DIR is required}
        target: /models
        read_only: true
        bind:
          create_host_path: false

volumes:
  postgres-data:
  pipeline-data:
