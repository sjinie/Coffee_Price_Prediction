services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coffee_price}
      POSTGRES_USER: ${POSTGRES_USER:-coffee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      target: api
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-coffee_price}
      PGUSER: ${POSTGRES_USER:-coffee}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ./frontend
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://api:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"

  pipeline:
    build:
      context: .
      target: pipeline
    profiles: ["jobs"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-coffee_price}
      PGUSER: ${POSTGRES_USER:-coffee}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      FRED_API_KEY: ${FRED_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - pipeline-data:/data
      - type: bind
        source: ${PIPELINE_MODELS_DIR:-./model_artifacts}
        target: /models
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PIPELINE_SOURCE_DIR:-./data/processed/2014-07-01_2025-12-31}
        target: /seed
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PIPELINE_ARTIFACT:-./model_artifacts/production_dlinear_60.pt}
        target: /app/model_artifacts/production_dlinear_60.pt
        read_only: true
        bind:
          create_host_path: false
    command: ["backfill", "--skip-ingestion", "--artifact", "/app/model_artifacts/production_dlinear_60.pt"]

volumes:
  postgres-data:
  pipeline-data:
