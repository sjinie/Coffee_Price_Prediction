name: Daily production pipeline

on:
  schedule:
    - cron: '17 6 * * *' # 15:17 Asia/Seoul; after New York midnight year-round
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coffee-production-pipeline
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: python -m pip install -r requirements-pipeline.txt
      - name: Refresh through SSH tunnel
        env:
          COFFEE_HOST: ${{ vars.COFFEE_HOST }}
          COFFEE_SSH_USER: ${{ vars.COFFEE_SSH_USER || 'coffee-actions' }}
          COFFEE_STATE_DIR: ${{ vars.COFFEE_STATE_DIR || '/srv/coffee/pipeline' }}
          COFFEE_SSH_KEY: ${{ secrets.COFFEE_SSH_KEY }}
          COFFEE_KNOWN_HOSTS: ${{ secrets.COFFEE_KNOWN_HOSTS }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          PGHOST: 127.0.0.1
          PGPORT: '15432'
          PGDATABASE: ${{ vars.COFFEE_DB_NAME || 'coffee_price' }}
          PGUSER: ${{ vars.COFFEE_DB_USER || 'coffee_pipeline' }}
          PGPASSWORD: ${{ secrets.COFFEE_PIPELINE_DB_PASSWORD }}
        run: bash deploy/run-daily-pipeline.sh
