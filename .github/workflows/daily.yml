name: Daily pipeline

# 운영 전환 전까지는 수동 실행만 둔다. 전환할 때 schedule(뉴욕 자정 이후)을 추가한다.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coffee-daily-pipeline
  cancel-in-progress: false

jobs:
  daily:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: python -m pip install -r requirements-pipeline.txt
      - name: Run pipeline through SSH tunnel
        env:
          COFFEE_HOST: ${{ vars.COFFEE_HOST }}
          COFFEE_SSH_USER: ${{ vars.COFFEE_SSH_USER || 'coffee-actions' }}
          COFFEE_STATE_DIR: ${{ vars.COFFEE_V2_STATE_DIR || '/srv/coffee/v2' }}
          COFFEE_SSH_KEY: ${{ secrets.COFFEE_SSH_KEY }}
          COFFEE_KNOWN_HOSTS: ${{ secrets.COFFEE_KNOWN_HOSTS }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          # 이전 버전의 COFFEE_DB_NAME(coffee_price)과 섞이지 않게 새 변수 이름을 쓴다.
          PGDATABASE: ${{ vars.COFFEE_V2_DB_NAME || 'coffee_v2' }}
          PGUSER: ${{ vars.COFFEE_DB_USER || 'coffee_pipeline' }}
          PGPASSWORD: ${{ secrets.COFFEE_PIPELINE_DB_PASSWORD }}
        run: bash deploy/run-daily.sh
