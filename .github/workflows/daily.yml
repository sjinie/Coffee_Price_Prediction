name: Daily pipeline

# 06:17 UTC는 서머타임과 관계없이 뉴욕 자정 이후다(이전 운영과 같은 시각).
# 주말에는 새 종가가 없어 예측 0건으로 끝나고 소스·뉴스만 갱신한다.
# 예약 실행은 늦게 시작할 수 있다(이전 운영에서 5–8시간). 빨리 봐야 하면 수동 실행한다.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coffee-daily-pipeline
  cancel-in-progress: false

jobs:
  daily:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: python -m pip install -r requirements-pipeline.txt
      - name: Run pipeline through SSH tunnel
        env:
          COFFEE_HOST: ${{ vars.COFFEE_HOST }}
          COFFEE_SSH_USER: ${{ vars.COFFEE_SSH_USER || 'coffee-actions' }}
          COFFEE_STATE_DIR: ${{ vars.COFFEE_V2_STATE_DIR || '/srv/coffee/v2' }}
          COFFEE_SSH_KEY: ${{ secrets.COFFEE_SSH_KEY }}
          COFFEE_KNOWN_HOSTS: ${{ secrets.COFFEE_KNOWN_HOSTS }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          # 이전 버전의 COFFEE_DB_NAME(coffee_price)과 섞이지 않게 새 변수 이름을 쓴다.
          PGDATABASE: ${{ vars.COFFEE_V2_DB_NAME || 'coffee_v2' }}
          PGUSER: ${{ vars.COFFEE_DB_USER || 'coffee_pipeline' }}
          PGPASSWORD: ${{ secrets.COFFEE_PIPELINE_DB_PASSWORD }}
        run: bash deploy/run-daily.sh
